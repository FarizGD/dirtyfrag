name: Build DirtyFrag
run-name: Build DirtyFrag Linux AMD64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure environment
        run: |
          echo "CC=gcc" >> $GITHUB_ENV

      - name: Compile dirtyfrag
        run: |
          $CC -O2 -Wall -o dirtyfrag exp.c

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-linux-amd64
          path: dirtyfrag
          retention-days: 30
