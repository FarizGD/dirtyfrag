name: Build DirtyFrag
run-name: Build DirtyFrag arm64
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动点按钮编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973

      - name: Configure env
        run: |
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "CC=$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV

      - name: Compile dirtyfrag
        run: |
          ${{ env.CC }} -O2 -Wall -o dirtyfrag dirtyfrag.c

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-arm64
          path: dirtyfrag
          retention-days: 30
